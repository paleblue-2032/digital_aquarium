<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>digital_aquarium — Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#041025;
    --cyan1:#00f0ff;
    --cyan2:#00aaff;
    --vio:#9b6aff;
  }

  body{
    margin:0;
    height:100vh;
    background: radial-gradient(circle at 50% 20%, rgba(0,100,255,0.1), transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, #010a16 80%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
    color:white;
  }

  .logo{
    position:relative;
    text-align:center;
  }

  /* メインタイトル */
  .logo h1{
    font-size: clamp(2.5rem, 7vw, 6rem);
    font-weight:700;
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, var(--cyan1), var(--cyan2), var(--vio));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0,200,255,0.4),
                 0 0 40px rgba(100,50,255,0.25);
    animation: glow 3s ease-in-out infinite alternate;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 12px rgba(0,240,255,0.3), 0 0 28px rgba(120,80,255,0.2); }
    100% { text-shadow: 0 0 24px rgba(0,240,255,0.8), 0 0 48px rgba(120,80,255,0.4); }
  }

  /* 泡のアニメーション */
  .bubbles{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    pointer-events:none;
    overflow:hidden;
  }
  .bubbles span{
    position:absolute;
    bottom:-50px;
    width:20px;
    height:20px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.2) 25%, transparent 70%);
    border-radius:50%;
    animation: rise linear infinite;
    opacity:0.7;
  }
  .bubbles span:nth-child(1){ left:10%; animation-duration:8s; animation-delay:-2s; width:14px; height:14px; }
  .bubbles span:nth-child(2){ left:30%; animation-duration:6s; animation-delay:-4s; }
  .bubbles span:nth-child(3){ left:50%; animation-duration:9s; animation-delay:-1s; width:24px; height:24px;}
  .bubbles span:nth-child(4){ left:70%; animation-duration:7s; animation-delay:-3s; }
  .bubbles span:nth-child(5){ left:85%; animation-duration:10s; animation-delay:-5s; width:18px; height:18px;}
  @keyframes rise{
    0% { transform: translateY(0) scale(0.8); opacity:0; }
    20% { opacity:1; }
    100% { transform: translateY(-110vh) scale(1.2); opacity:0; }
  }

  /* スキャンライン */
  .scanlines{
    position:absolute;
    inset:0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 3px;
    mix-blend-mode: overlay;
    animation: scan 8s linear infinite;
  }
  @keyframes scan{
    0% { background-position: 0 0; }
    100% { background-position: 0 400px; }
  }
</style>
</head>
<body>
  <div class="logo">
    <h1>digital_aquarium</h1>
    <div class="bubbles">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="scanlines"></div>
  </div>
</body>
</html>
